<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Récepteur</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:flex-start;justify-content:center;font-family:Arial,Helvetica,sans-serif}
#word{
  margin-top:max(10px,env(safe-area-inset-top));
  width:100%;
  text-align:center;
  color:#2b2b2b;
  font-weight:600;
  font-size:clamp(38px,12vw,110px);
  line-height:1.05;
  padding:0 12px;
  box-sizing:border-box;
  word-break:break-word;
}
#status{
  position:fixed;bottom:6px;left:0;right:0;text-align:center;
  color:#080808;font-size:10px;font-family:Arial,sans-serif;
}
</style>
</head>
<body>
<div id="word"></div>
<div id="status">prêt</div>
<script>
const wordEl=document.getElementById('word');
const statusEl=document.getElementById('status');
let lastId=null;

async function poll(){
  try {
    const r = await fetch('https://ntfy.sh/livre-magique-s8-7f3a9c2d/json?poll=1&since=10s', {cache:'no-store'});
    const txt = await r.text();
    const lines = txt.trim().split(/\n+/).filter(Boolean);
    for (const line of lines) {
      let ev; try{ev=JSON.parse(line)}catch{continue}
      if(ev.event!=='message' || !ev.message) continue;
      if(ev.id===lastId) continue;
      lastId=ev.id;
      let p; try{p=JSON.parse(ev.message)}catch{continue}
      if(p && p.word){
        wordEl.textContent = p.word;
        statusEl.textContent = '';
      }
    }
  } catch(e) {}
  setTimeout(poll,1200);
}
poll();

document.addEventListener('click',()=>{ wordEl.textContent=''; });
</script>
</body>
</html>
