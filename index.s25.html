<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title></title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  background:#000;
  overflow:hidden;
  overscroll-behavior:none;
}
body{
  position:fixed;
  inset:0;
  background:#000;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  font-family:Arial,Helvetica,sans-serif;
}
#black{
  position:fixed;
  inset:0;
  background:#000;
  width:100vw;
  height:100dvh;
}
#word{
  position:fixed;
  top:max(8px, env(safe-area-inset-top));
  left:0;
  right:0;
  width:100%;
  padding:0 10px;
  text-align:center;
  color:#242424;
  font-weight:600;
  font-size:clamp(42px,13vw,120px);
  line-height:1.02;
  letter-spacing:-0.02em;
  word-break:break-word;
  opacity:0;
  transition:opacity .12s linear;
  z-index:2;
}
#word.show{opacity:1}
</style>
</head>
<body>
<div id="black"></div>
<div id="word"></div>

<script>
const wordEl = document.getElementById('word');
let lastId = null;

async function tryFullscreen() {
  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen({navigationUI:'hide'});
    }
  } catch(e) {}
}

async function poll() {
  try {
    const r = await fetch('https://ntfy.sh/livre-magique-s8-7f3a9c2d/json?poll=1&since=10s', {cache:'no-store'});
    const txt = await r.text();
    const lines = txt.trim().split(/\n+/).filter(Boolean);

    for (const line of lines) {
      let ev;
      try { ev = JSON.parse(line); } catch { continue; }
      if (ev.event !== 'message' || !ev.message) continue;
      if (ev.id === lastId) continue;
      lastId = ev.id;

      let payload;
      try { payload = JSON.parse(ev.message); } catch { continue; }
      if (payload && payload.word) {
        wordEl.textContent = payload.word;
        wordEl.classList.add('show');
      }
    }
  } catch(e) {}

  setTimeout(poll, 1000);
}

document.addEventListener('click', () => {
  if (wordEl.classList.contains('show')) {
    wordEl.classList.remove('show');
    setTimeout(() => { wordEl.textContent = ''; }, 150);
  } else {
    tryFullscreen();
  }
}, {passive:true});

document.addEventListener('touchstart', tryFullscreen, {once:true, passive:true});

poll();
</script>
</body>
</html>
